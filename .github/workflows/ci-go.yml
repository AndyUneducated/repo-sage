name: CI · Go HNSW

on:
  push:
    branches: [main]
    paths:
      - "go-hnsw/**"
      - "proto/**"
      - ".github/workflows/ci-go.yml"
  pull_request:
    paths:
      - "go-hnsw/**"
      - "proto/**"
      - ".github/workflows/ci-go.yml"

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-hnsw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go-hnsw/go.sum

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt issues:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build (server + bench)
        run: |
          mkdir -p bin
          go build -o bin/hnsw-server ./cmd/server
          go build -o bin/hnsw-bench ./cmd/bench

      - name: Test (-race)
        # Only packages with *_test.go files: ./... + -coverprofile fails on
        # zero-test packages (cmd/*, hnswpb, …) with "no such tool covdata".
        run: go test -race -count=1 -coverprofile=coverage.out $(go list -f '{{if .TestGoFiles}}{{.ImportPath}}{{end}}' ./...)

      - name: Smoke-boot the server
        run: |
          ./bin/hnsw-server -addr 127.0.0.1:50099 -db /tmp/none.db -dim 4 &
          PID=$!
          sleep 1
          kill $PID
          wait $PID || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: go-hnsw/coverage.out
