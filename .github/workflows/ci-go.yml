name: CI · Go HNSW

on:
  push:
    branches: [main]
    paths:
      - "go-hnsw/**"
      - ".github/workflows/ci-go.yml"
  pull_request:
    paths:
      - "go-hnsw/**"
      - ".github/workflows/ci-go.yml"

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-hnsw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go-hnsw/go.sum

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt issues:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          mkdir -p bin
          go build -o bin/hnsw-server ./cmd/server
          go build -o bin/hnsw-bench ./cmd/bench

      - name: Test (-race)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: go-hnsw/coverage.out
