name: Eval Gate · Cross-File QA

# Runs the 200-question benchmark against a small evaluator LLM and fails
# the workflow if accuracy regresses below the recorded baseline. Wired in
# as a required check from Phase 6 onward; this file gates only the eval
# job and never the regular Python CI matrix.

on:
  pull_request:
    paths:
      - "reposage/**"
      - "benchmarks/cross_file_qa/**"
      - ".github/workflows/eval-gate.yml"
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

jobs:
  eval:
    if: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-eval') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Run benchmark (stub)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m benchmarks.cross_file_qa.run_eval --route auto
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: benchmarks/cross_file_qa/results/
