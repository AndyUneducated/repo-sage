name: Eval Gate · Cross-File QA + Phase 2 RAG

# Two evaluation jobs:
#
#   * bench-rag       — Phase 2 hybrid RAG benchmark on the tiny fixture
#                       with the mock LLM. Always runs on PR; gates merges.
#   * cross-file-qa   — Phase 4 evaluation harness against a real LLM. Only
#                       runs on a `run-eval` label or weekly schedule because
#                       it needs the OPENAI_API_KEY secret.

on:
  pull_request:
    paths:
      - "reposage/**"
      - "benchmarks/**"
      - "tests/**"
      - "proto/**"
      - "pyproject.toml"
      - ".github/workflows/eval-gate.yml"
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Phase 2 RAG benchmark (mock LLM)
        env:
          REPOSAGE_RAG_LLM: mock
        run: |
          python -m benchmarks.rag.run_eval

  cross-file-qa:
    if: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'run-eval') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Run benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m benchmarks.cross_file_qa.run_eval --route auto
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: benchmarks/cross_file_qa/results/
