repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending

  # Drive the project venv's ruff to avoid version skew with `make lint`.
  # The mirrored ruff at v0.6.9 was stripping `# noqa` codes that newer
  # ruff (v0.15+, used by `make lint` and CI) still enforces.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (project venv)
        # --force-exclude is required because pre-commit passes explicit
        # file paths; ruff's `exclude` / `extend-exclude` only filter
        # explicit args when this flag is set. Without it, generated
        # files under reposage/proto/ would be re-formatted on commit.
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (project venv)
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # Use the project venv's mypy via a local hook. The mirrored mypy
  # repo runs in pre-commit's isolated env and would need every runtime
  # dep duplicated under additional_dependencies (litellm, grpcio,
  # tree-sitter, rank-bm25, sentence-transformers, ...). Driving the
  # installed mypy is simpler and stays in lockstep with `make typecheck`.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [--config-file=pyproject.toml, reposage]
        files: ^reposage/
