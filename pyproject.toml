[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reposage"
version = "0.1.0"
description = "Repository-level code Q&A with dual-index (Symbol Graph + GraphRAG) and a self-built Go HNSW vector store."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Anning" }]
keywords = ["code-search", "rag", "graphrag", "hnsw", "tree-sitter", "github-app"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-language-pack>=1.6,<2",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "litellm>=1.60",
    "sentence-transformers>=3.0",
    "networkx>=3.3",
    "python-igraph>=0.11",         # for Leiden community detection
    "leidenalg>=0.10",
    "structlog>=24.4",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-requests",
    "ipython",
]
eval = [
    "ragas>=0.1.20",
    "datasets>=2.20",
    "pandas>=2.2",
]
bench = [
    # Phase 4 SIFT-1M sweep: Faiss baseline + Pareto plotting. Kept out of the
    # default install so the core service does not carry the faiss wheel.
    "faiss-cpu>=1.8",
    "matplotlib>=3.8",
]

[project.scripts]
reposage = "reposage.cli:app"

[project.urls]
Homepage = "https://github.com/AndyUneducated/repo-sage"
Issues = "https://github.com/AndyUneducated/repo-sage/issues"
Documentation = "https://github.com/AndyUneducated/repo-sage/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["reposage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["reposage", "tests", "benchmarks"]
extend-exclude = ["reposage/proto"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # simplify
    "RUF",                # ruff-specific
    "PL",                 # pylint subset
    "TID",                # tidy imports
]
ignore = [
    "PLR0913",            # too many args (FastAPI deps)
    "PLR2004",            # magic value
    "E501",               # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101"]
"benchmarks/**/*" = ["PLR2004"]
"reposage/cli.py" = ["B008", "PLC0415"]
"reposage/api/routes/*.py" = ["B008"]
"reposage/indexer/parser.py" = ["PLC0415"]
"reposage/observability/otel.py" = ["PLC0415", "PLW0603"]
"reposage/proto/*.py" = ["E501", "F401", "I001", "UP", "RUF", "PL"]

[tool.ruff.format]
docstring-code-format = true
exclude = ["reposage/proto/*.py", "reposage/proto/*.pyi"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["benchmarks/", "build/", "dist/", "reposage/proto/"]

[[tool.mypy.overrides]]
module = [
    "tree_sitter.*",
    "tree_sitter_language_pack.*",
    "leidenalg.*",
    "igraph.*",
    "rank_bm25.*",
    "grpc.*",
    "grpc",
    "google.*",
    "litellm.*",
    "sentence_transformers.*",
    "reposage.proto.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reposage.api.*", "reposage.cli"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
# All async tests share one session-scoped event loop. Tests that touch the
# real LiteLLMClient hit a global LoggingWorker that binds to the *first*
# event loop it sees; with per-test loops, the second test would trip the
# library's "loop changed -> drop queue" path and orphan a logging coroutine
# (RuntimeWarning: coroutine 'Logging.async_success_handler' was never
# awaited). Sharing a loop keeps the worker on a single, valid binding for
# the whole test session.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: long-running integration tests",
    "requires_models: tests that download model weights",
    "requires_go_hnsw: tests that need go-hnsw running locally",
    "requires_ollama: tests that need a running Ollama daemon",
]

[tool.coverage.run]
source = ["reposage"]
branch = true
omit = ["reposage/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
