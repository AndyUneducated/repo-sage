[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reposage"
version = "0.1.0"
description = "Repository-level code Q&A with dual-index (Symbol Graph + GraphRAG) and a self-built Go HNSW vector store."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Anning" }]
keywords = ["code-search", "rag", "graphrag", "hnsw", "tree-sitter", "github-app"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-languages>=1.10",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "litellm>=1.45",
    "sentence-transformers>=3.0",
    "networkx>=3.3",
    "python-igraph>=0.11",         # for Leiden community detection
    "leidenalg>=0.10",
    "structlog>=24.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-requests",
    "ipython",
]
eval = [
    "ragas>=0.1.20",
    "datasets>=2.20",
    "pandas>=2.2",
]

[project.scripts]
reposage = "reposage.cli:app"

[project.urls]
Homepage = "https://github.com/AndyUneducated/repo-sage"
Issues = "https://github.com/AndyUneducated/repo-sage/issues"
Documentation = "https://github.com/AndyUneducated/repo-sage/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["reposage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["reposage", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "SIM",                # simplify
    "RUF",                # ruff-specific
    "PL",                 # pylint subset
    "TID",                # tidy imports
]
ignore = [
    "PLR0913",            # too many args (FastAPI deps)
    "PLR2004",            # magic value
    "E501",               # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101"]
"benchmarks/**/*" = ["PLR2004"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["benchmarks/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_languages.*", "leidenalg.*", "igraph.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: long-running integration tests",
    "requires_models: tests that download model weights",
    "requires_go_hnsw: tests that need go-hnsw running locally",
]

[tool.coverage.run]
source = ["reposage"]
branch = true
omit = ["reposage/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
